name: Verify application and command contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: npm ci --prefix tool/central_migration/server
      - run: npm test --prefix tool/central_migration/server
      - run: node --test tool/central_migration/test/*.test.js
      - run: node tool/central_migration/generate_rules.js --check
      - run: node tool/firebase/prepare_rules_release.cjs
      - run: npm install --global firebase-tools
      - run: firebase emulators:exec --config build/firebase.release.json --only firestore,auth --project demo-materiallab "powershell -NoProfile -File tool/firebase/verify_emulators.ps1"
