name: material_lab
description: "Material Lab — مختبر المواد الخام"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Database ──────────────────────
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0

  # ── Auth & secure storage ─────────
  flutter_secure_storage: ^9.0.0

  # ── State & DI ─────────────────────
  get_it: ^7.6.0

  # ── PDF, Excel & QR ────────────────
  pdf: ^3.10.0
  excel: ^4.0.6
  qr: ^3.0.0
  image: ^4.3.0

  # ── Crypto (PBKDF2 + HMAC-XOR seal) ─
  pointycastle: ^3.8.0
  crypto: ^3.0.3

  # ── Backup / File ───────────────────
  file_picker: ^8.0.0
  path_provider: ^2.1.0

  # ── Navigation ──────────────────────
  go_router: ^13.0.0

  # ── Utils ───────────────────────────
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/Reference.xlsx
    - assets/units.xlsx
    - assets/images/
    - assets/icons/
    - assets/templates/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf