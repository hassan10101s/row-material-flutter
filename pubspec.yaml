name: material_lab
description: "Material Lab — مختبر المواد الخام"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Database ──────────────────────
  sqflite: ^2.3.0
  sqflite_common_ffi: 2.4.0
  # `utils.setLockWarningInfo` - the connection-lock diagnostics in
  # `core/database/database_helper.dart` go through this package directly.
  sqflite_common: ^2.5.13
  path: ^1.9.0

  # ── Auth & secure storage ─────────
  flutter_secure_storage: ^9.0.0

  # ── State & DI ─────────────────────
  get_it: ^7.6.0

  # ── PDF, Excel & QR ────────────────
  pdf: ^3.10.0
  excel: ^4.0.6
  qr: ^3.0.0
  image: ^4.3.0

  # ── Crypto (PBKDF2 + HMAC-XOR seal) ─
  pointycastle: ^3.8.0
  crypto: ^3.0.3

  # ── Backup / File ───────────────────
  file_picker: ^8.0.0
  path_provider: ^2.1.0

  # ── Navigation ──────────────────────
  go_router: ^13.0.0

  # ── Charts (dashboard KPIs) ───────────
  fl_chart: ^0.69.0

  # ── Utils ───────────────────────────
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  google_sign_in: 6.3.0
  google_sign_in_dartio: 0.3.0
  # Mobile-only QR reader (inspection reports and labels). CameraX/ML Kit on
  # Android; never constructed on desktop (see QrScanScreen). Camera
  # permission goes through the app's own Android channel
  # (core/platform/camera_permission.dart): the permission plugin ships a
  # Windows implementation that downloads a NuGet package at build time and
  # breaks `flutter run` on Windows.
  mobile_scanner: ^7.4.2
  open_filex: ^4.7.0
  share_plus: ^12.0.2
  image_picker: ^1.2.3
  workmanager: ^0.10.10
dependency_overrides:
  # FirebaseAuth's Android ID-token listener can run on a Firebase worker
  # thread; use the local copy that posts those events to Android's main thread.
  firebase_auth:
    path: third_party/firebase_auth

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  http: ^1.2.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/Reference.xlsx
    - assets/units.xlsx
    - assets/images/
    - assets/templates/
    # Directory, not the single file: `firebase.local.json` is git-ignored, so
    # declaring the file itself would break the build on a clean clone.
    - assets/firebase/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf