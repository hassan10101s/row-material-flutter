name: material_lab
description: "Material Lab — مختبر المواد الخام"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Database ──────────────────────
  sqflite: ^2.3.0
  sqflite_common_ffi: 2.4.0
  # `utils.setLockWarningInfo` - the connection-lock diagnostics in
  # `core/database/database_helper.dart` go through this package directly.
  sqflite_common: ^2.5.13
  path: ^1.9.0

  # ── Auth & secure storage ─────────
  flutter_secure_storage: ^9.0.0

  # ── State & DI ─────────────────────
  get_it: ^7.6.0

  # ── PDF, Excel & QR ────────────────
  pdf: ^3.10.0
  excel: ^4.0.6
  qr: ^3.0.0
  image: ^4.3.0

  # ── Crypto (PBKDF2 + HMAC-XOR seal) ─
  pointycastle: ^3.8.0
  crypto: ^3.0.3

  # ── Backup / File ───────────────────
  file_picker: ^8.0.0
  path_provider: ^2.1.0

  # ── Navigation ──────────────────────
  go_router: ^13.0.0

  # ── Charts (dashboard KPIs) ───────────
  fl_chart: ^0.69.0

  # ── Utils ───────────────────────────
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  equatable: ^2.1.0
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  google_sign_in: 6.3.0
  google_sign_in_dartio: 0.3.0
  open_filex: ^4.7.0
  share_plus: ^12.0.2
  image_picker: ^1.2.3
  workmanager: ^0.10.10

  # `device_info_plus` was dropped on purpose: the device registry only needs
  # `Platform.operatingSystemVersion` (dart:io), and the plugin's `web: ^1.1.0`
  # constraint is incompatible with the sqlite3 2.x line required by
  # `sqflite_common_ffi`.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  http: ^1.2.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/Reference.xlsx
    - assets/units.xlsx
    - assets/images/
    - assets/templates/
    # Directory, not the single file: `firebase.local.json` is git-ignored, so
    # declaring the file itself would break the build on a clean clone.
    - assets/firebase/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf